# Alembic «Полилога» (прод-режим миграций вместо create_all, doc 01 §5).
# Запуск из core/: ..\.venv\Scripts\python.exe -m alembic -c alembic.ini upgrade head
[alembic]
script_location = migrations
prepend_sys_path = .
# URL берётся из env POLYLOG_DATABASE_URL (migrations/env.py); тут не храним секретов
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
