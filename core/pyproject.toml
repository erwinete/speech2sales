[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polylog-core"
version = "0.1.0"
description = "Полилог — self-hosted речевая аналитика для отделов продаж (ядро: API, пайплайн, граф)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.30",
  "aiosqlite>=0.20",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "jsonschema>=4.22",
]
worker = ["procrastinate>=2.0", "psycopg[binary,pool]>=3.1"]
# ASR: torch CPU — pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
# gigaam ставится из GitHub (нет на PyPI):
#   pip install "gigaam @ https://github.com/salute-developers/GigaAM/archive/refs/heads/main.zip"
# веса моделей: POLYLOG_MODEL_DIR=<каталог на большом диске> (по умолчанию ~/.cache/gigaam)
asr = ["numpy>=1.26", "onnxruntime>=1.18", "soundfile>=0.12"]
pg = ["asyncpg>=0.29"]

[project.scripts]
polylog-api = "polylog.api.main:run"

[tool.hatch.build.targets.wheel]
packages = ["polylog"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
source = ["polylog"]
omit = ["polylog/asr/gigaam.py", "polylog/asr/tone.py"]

[tool.coverage.report]
fail_under = 70
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "UP042"]  # B008: FastAPI Depends() в дефолтах; UP042: (str, Enum) осознанно для SQLAlchemy

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
